name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Thumblify---AI-Thumbnail-Generator

            git pull origin main

            cd server
            npm install
            pm2 restart thumblify-backend

            cd ../client
            npm install
            npm run build
            pm2 restart thumblify-frontend